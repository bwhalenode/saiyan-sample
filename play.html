<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="$SAIYAN training grounds. Awaken your power and play the community game." />
  <meta name="theme-color" content="#050306" />
  <title>$SAIYAN - Training Grounds</title>

  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/src/play.css" />
</head>
<body>
  <div class="play-shell">
    <div class="play-shell__glow" aria-hidden="true"></div>

    <header class="play-header">
      <a class="play-brand" href="/" aria-label="Return to $SAIYAN home">
        <img src="/images/logo.png" alt="" aria-hidden="true" />
        <span class="play-brand__text">$SAIYAN</span>
      </a>

      <nav class="play-socials" aria-label="$SAIYAN social links">
        <a href="https://x.com/supersaiyancto" target="_blank" rel="noopener noreferrer" aria-label="X / Twitter">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.747l7.73-8.835L1.254 2.25H8.08l4.259 5.63L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
          </svg>
        </a>
        <a href="https://t.me/SAIYANonETHPortal" target="_blank" rel="noopener noreferrer" aria-label="Telegram">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
          </svg>
        </a>
      </nav>

      <div class="play-actions">
        <button class="play-sound-toggle" type="button" aria-label="Enable sound" aria-pressed="false">
          <svg class="play-sound-icon play-sound-icon--muted" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 9v6h4l5 4V5L8 9H4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="M17 9l4 4m0-4l-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <svg class="play-sound-icon play-sound-icon--on" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 9v6h4l5 4V5L8 9H4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="M17 8c1.2 1.1 1.8 2.5 1.8 4s-.6 2.9-1.8 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M19.5 5.5A9 9 0 0 1 22 12a9 9 0 0 1-2.5 6.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
        <a class="play-exit" href="/" aria-label="Exit game and return to website">EXIT</a>
      </div>
    </header>

    <main class="play-main">
      <div class="play-frame-wrap">
        <div class="play-frame-wrap__edge" aria-hidden="true"></div>
        <iframe
          class="play-frame"
          src="https://games.heidrunbot.app/game/saiyan.html"
          title="$SAIYAN community game"
          loading="eager"
          allow="autoplay"
        ></iframe>
      </div>
    </main>
  </div>
  <script type="module" src="/src/play.js"></script>
</body>
</html>
