<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="$SAIYAN training grounds. Awaken your power and play the community game." />
  <meta name="theme-color" content="#050306" />
  <title>$SAIYAN - Training Grounds</title>

  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/src/play.css" />
</head>
<body>
  <div class="play-shell">
    <div class="play-shell__glow" aria-hidden="true"></div>

    <main class="play-main">
      <div class="play-frame-wrap">
        <div class="play-frame-wrap__edge" aria-hidden="true"></div>
        <iframe
          class="play-frame"
          src="https://games.heidrunbot.app/game/saiyan.html"
          title="$SAIYAN community game"
          loading="eager"
          allow="autoplay"
        ></iframe>
        <a class="play-frame-exit" href="/" aria-label="Exit game and return to website">
          ← EXIT
        </a>
        <button class="play-sound-toggle" type="button">♫ ENABLE SOUND</button>
      </div>
    </main>
  </div>
  <script type="module" src="/src/play.js"></script>
</body>
</html>
