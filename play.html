<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="$SAIYAN training grounds. Awaken your power and play the community game." />
  <meta name="theme-color" content="#050306" />
  <title>$SAIYAN - Training Grounds</title>

  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/src/play.css" />
</head>
<body>
  <div class="play-shell">
    <div class="play-shell__glow" aria-hidden="true"></div>

    <header class="play-header">
      <a class="play-brand" href="/" aria-label="Return to $SAIYAN home">
        <img src="/images/logo.png" alt="" aria-hidden="true" />
        <span>$SAIYAN</span>
      </a>

      <div class="play-header__actions">
        <a class="play-link" href="/" aria-label="Return to website">WEBSITE</a>
        <a
          class="play-link play-link--primary"
          href="https://games.heidrunbot.app/game/saiyan.html"
          target="_blank"
          rel="noopener noreferrer"
        >OPEN GAME</a>
      </div>
    </header>

    <main class="play-main">
      <div class="play-intro">
        <p class="play-eyebrow">TRAINING GROUNDS</p>
        <h1>AWAKEN YOUR POWER.</h1>
        <p>Enter the arena. On mobile, use <strong>OPEN GAME</strong> for the cleanest full-screen experience.</p>
      </div>

      <div class="play-frame-wrap">
        <div class="play-frame-wrap__edge" aria-hidden="true"></div>
        <iframe
          class="play-frame"
          src="https://games.heidrunbot.app/game/saiyan.html"
          title="$SAIYAN community game"
          allow="fullscreen"
          loading="eager"
        ></iframe>
      </div>
    </main>
  </div>
</body>
</html>
