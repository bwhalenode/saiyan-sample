<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="The Hall of Power — every awakening the $SAIYAN community has unleashed." />
  <meta name="theme-color" content="#050306" />
  <title>$SAIYAN - Hall of Power</title>

  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/src/gallery.css" />
</head>
<body>
  <div class="gal-shell">
    <div class="gal-shell__glow" aria-hidden="true"></div>

    <header class="gal-header">
      <a class="gal-brand" href="/" aria-label="Return to $SAIYAN home">
        <img src="/images/logo.png" alt="" aria-hidden="true" />
        <span class="gal-brand__text">$SAIYAN</span>
      </a>
      <div class="gal-actions">
        <a class="gal-cta" href="/#creator">AWAKEN YOURS</a>
        <a class="gal-back" href="/" aria-label="Back to the main page" title="Back">×</a>
      </div>
    </header>

    <main class="gal-main">
      <p class="gal-eyebrow">POWER UNLEASHED</p>
      <h1 class="gal-title">HALL OF POWER</h1>
      <p class="gal-sub">Every awakening the community has unleashed.</p>

      <!-- One rail per category, built in gallery.js from the same TABS map the
           feed uses, so the markup cannot drift from the categories. -->
      <div class="gal-rails" data-rails></div>
    </main>
  </div>

  <div class="gal-light" data-lightbox hidden>
    <button class="gal-light__close" type="button" data-close aria-label="Close">×</button>
    <figure class="gal-light__stage" data-stage></figure>
    <button class="gal-light__nav gal-light__nav--prev" type="button" data-prev aria-label="Previous">‹</button>
    <button class="gal-light__nav gal-light__nav--next" type="button" data-next aria-label="Next">›</button>
  </div>

  <script type="module" src="/src/gallery.js"></script>
</body>
</html>
